name: record
on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: record
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - name: Lock plays, grade finals, save ledger
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: python run.py
      - name: Commit ledger
        run: |
          git config user.name "record-bot"
          git config user.email "record-bot@users.noreply.github.com"
          git add ledger.json
          git diff --cached --quiet || (git commit -m "update record" && git push)
